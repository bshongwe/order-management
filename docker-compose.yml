services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: order-management-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/bin/bash -c '</dev/tcp/localhost/1433'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: order-management-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-orderapp}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  migrator:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      ConnectionStrings__Orders: "Server=sqlserver,1433;Database=OrderManagement;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
    command: ["/bin/bash", "-c", "dotnet tool restore && dotnet ef database update --project src/OrderManagement.Infrastructure --startup-project src/OrderManagement.Api"]
    depends_on:
      sqlserver:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: src/OrderManagement.Api/Dockerfile
    container_name: order-management-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Orders: "Server=sqlserver,1433;Database=OrderManagement;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      Entra__Authority: ${ENTRA_AUTHORITY:?Set ENTRA_AUTHORITY in .env}
      Entra__Audience: ${ENTRA_AUDIENCE:?Set ENTRA_AUDIENCE in .env}
      Cors__AllowedOrigins__0: http://localhost:8081
    ports:
      - "8080:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: src/OrderManagement.Worker/Dockerfile
    container_name: order-management-worker
    environment:
      ConnectionStrings__Orders: "Server=sqlserver,1433;Database=OrderManagement;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__Username: ${RABBITMQ_DEFAULT_USER:-orderapp}
      RabbitMq__Password: ${RABBITMQ_DEFAULT_PASS}
    depends_on:
      migrator:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE_URL: http://localhost:8080
    container_name: order-management-web
    ports:
      - "8081:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  sqlserver-data:
